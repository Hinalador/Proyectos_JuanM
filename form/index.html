<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Formulario de registro</title>
</head>

<body>
    <form action="#" method="post">
        <main>
            <h1>Formulario de registro</h1>
            <section>
                <div>
                    <label for="nombre">Nombre completo:</label>
                </div>
                <div>
                    <input type="text" id="nombre" name="usuario_nombre" required>
                </div>
            </section>
            <section>
                <div>
                    <label for="correo">Correo electrónico:</label>
                </div>
                <div>
                    <input type="email" id="correo" name="usuario_correo" required>
                </div>
            </section>
            <section>
                <div>
                    <label for="password">Contraseña:</label>
                </div>
                <div>
                    <input type="password" id="password" name="usuario_password" required>
                </div>
            </section>
            <section>
                <div>
                    <label for="telefono">Teléfono:</label>
                </div>
                <div>
                    <input type="tel" id="telefono" name="usuario_telefono" autocomplete="tel">
                </div>
            </section>
            <section>
                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                </div>
                <div>
                    <input type="date" id="fecha_nacimiento" name="usuario_fecha_nacimiento">
                </div>
            </section>
            <section>
                <div>
                    <label for="pais">País:</label>
                </div>
                <div>
                    <select id="pais" name="usuario_pais" required>
                        <option value="" selected disabled>Selecciona un país</option>
                        <option value="colombia">Colombia</option>
                        <option value="mexico">México</option>
                        <option value="espana">España</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
            </section>
            <section>
                <div>
                    <span>¿Cómo prefieres que te contactemos?</span>
                </div>
                <div class="opciones">
                    <label for="contacto_correo">
                        <input type="radio" id="contacto_correo" name="preferencia_contacto" value="correo">
                        Correo
                    </label>
                    <label for="contacto_telefono">
                        <input type="radio" id="contacto_telefono" name="preferencia_contacto" value="telefono">
                        Teléfono
                    </label>
                </div>
            </section>
            <section>
                <div class="opciones">
                    <label for="acepta_terminos">
                        <input type="checkbox" id="acepta_terminos" name="acepta_terminos" required>
                        Acepto los términos y condiciones
                    </label>
                </div>
            </section>
            <section>
                <div>
                    <label for="message">Mensaje:</label>
                </div>
                <div>
                    <textarea id="message" name="usuario_message"></textarea>
                </div>
            </section>
            <button type="submit">Registrarse</button>
        </main>
    </form>
</body>

</html>
